services:
  paper-agents:
    build: .
    ports:
      - "7860:7860"
    environment:
      PAPER_AGENTS_DATABASE: /app/data/research.db
      PAPER_AGENTS_REPORTS: /app/data/reports
      PAPER_AGENTS_UPLOADS: /app/data/uploads
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    volumes:
      - ./data:/app/data
    restart: unless-stopped
