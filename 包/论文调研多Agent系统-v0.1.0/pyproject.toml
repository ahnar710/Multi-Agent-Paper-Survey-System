[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-research-agents"
version = "0.1.0"
description = "A traceable multi-agent literature research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pypdf>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]
ui = ["gradio>=6.0,<7"]

[project.scripts]
paper-agents = "paper_agents.cli:main"
paper-agents-ui = "paper_agents.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
