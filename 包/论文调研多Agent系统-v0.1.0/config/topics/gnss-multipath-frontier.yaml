topic_id: gnss-multipath-frontier
title_zh: GNSS 多径效应前沿研究
audience: GNSS 产品经理
language:
  report: zh-CN
  search: [en, zh]

decision_questions:
  - 当前多径检测、建模和抑制技术的主要路线是什么？
  - 哪些方法已经具备实时部署或产品化潜力？
  - 不同方案对接收机硬件、原始观测量、算力和外部传感器有什么要求？
  - 各方案在城市峡谷、低成本终端、测量型接收机和车载场景中的效果如何？
  - 近五年出现了哪些值得跟踪的新方法、数据集和评价基准？

scope:
  primary_years: [2021, 2026]
  allow_classic_baselines: true
  systems: [GPS, BDS, Galileo, GLONASS, multi-GNSS]
  observations: [pseudorange, carrier_phase, doppler, correlator_output, raw_IQ]
  scenarios:
    - urban_canyon
    - autonomous_driving
    - low_cost_receiver
    - precision_surveying
    - deformation_monitoring
    - static_reference_station
    - uav_and_robotics

# Multipath: 直达波与反射波并存；NLOS: 直达波被遮挡。两类记录不得混为同一标签。
phenomena: [multipath, nlos, mixed]

research_tracks:
  - id: signal_processing
    title_zh: 相关器、跟踪环与多径参数估计
    daily_target: 18
  - id: carrier_phase_modeling
    title_zh: 载波相位多径时空建模与改正
    daily_target: 16
  - id: machine_learning
    title_zh: 多径/NLOS 识别、回归和学习增强滤波
    daily_target: 22
  - id: direct_positioning
    title_zh: 直接定位、因子图与鲁棒估计
    daily_target: 14
  - id: antenna_array
    title_zh: 天线、阵列与射频前端抑制
    daily_target: 12
  - id: sensor_map_aided
    title_zh: 视觉、LiDAR、3D 地图及多传感器辅助
    daily_target: 18

quality_rules:
  include:
    - 有明确 GNSS 多径或 NLOS 问题定义
    - 有方法细节及实验、仿真或真实数据验证
    - 报告可比较的定位或观测域指标
  exclude:
    - 只在背景中提及多径
    - 非 GNSS 的通信或室内定位多径研究
    - 无法确认来源或正文的二手转载
    - 缺少方法与验证信息的营销材料
  preferred_sources:
    - peer_reviewed_journal
    - peer_reviewed_conference
    - official_preprint_with_code_or_data
  minimum_product_relevance: 2
  minimum_scientific_quality: 3

required_comparisons:
  - positioning_error_before_after
  - baseline_and_ablation
  - compute_and_latency
  - hardware_and_data_requirements
  - generalization_across_sites_receivers_constellations
  - availability_of_code_and_dataset

daily_acceptance:
  verified_full_text_cards: 100
  abstract_only_cards_count_toward_target: false
  require_source_locator: true
  require_deduplication: true
  require_verifier_pass: true

